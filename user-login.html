<!DOCTYPE html>
<html>
<head>
  <title>User Login</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; margin: 0; }
    .card { background: white; padding: 2.5rem; border-radius: 1.5rem; width: 320px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; font-weight: 800; text-align: center; color: #1e293b; }
    input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; box-sizing: border-box; }
    .btn-login { width: 100%; padding: 0.8rem; border-radius: 0.5rem; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; margin-bottom: 0.5rem; }
    .btn-reg { width: 100%; padding: 0.8rem; border-radius: 0.5rem; border: 1px solid #2563eb; background: white; color: #2563eb; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .back { display: block; text-align: center; margin-top: 1rem; color: #64748b; text-decoration: none; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>User Login</h2>

  <input id="userEmail" type="email" placeholder="Email"><br>
  <input id="userPassword" type="password" placeholder="Password"><br>

  <button class="btn-login" onclick="loginUser()">Existing User Login</button>
  <button class="btn-reg" onclick="registerUser()">New User Register</button>
  <a href="index.html" class="back">← Back to Selection</a>
</div>

<script>
function registerUser() {
  const email = document.getElementById("userEmail").value.trim();
  const password = document.getElementById("userPassword").value.trim();

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }

  let users = JSON.parse(localStorage.getItem("users")) || [];

  if (users.some(u => u.email === email)) {
    alert("User already exists. Please login.");
    return;
  }

  users.push({ email, password });
  localStorage.setItem("users", JSON.stringify(users));

  alert("✅ Registration success. Now login.");
}

function loginUser() {
  const email = document.getElementById("userEmail").value.trim();
  const password = document.getElementById("userPassword").value.trim();

  let users = JSON.parse(localStorage.getItem("users")) || [];

  const validUser = users.find(
    u => u.email === email && u.password === password
  );

  if (validUser) {
    localStorage.setItem("loggedInUser", email);
    window.location.href = "user-dashboard.html";
  } else {
    alert("❌ Invalid login or user not registered");
  }
}
</script>

</body>
</html>
